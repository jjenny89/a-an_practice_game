    <style>
        /* 自訂字體與兒童友善樣式 */
        body {
            font-family: 'Nunito', 'Noto Sans TC', sans-serif;
            background-color: #FFFDF5;
            background-image: radial-gradient(#FDE68A 2px, transparent 2px), radial-gradient(#BAE6FD 2px, #FFFDF5 2px);
            background-size: 48px 48px;
            background-position: 0 0, 24px 24px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* 3D 立体按鈕效果 */
        .btn-3d {
            transition: all 0.1s ease;
            box-shadow: 0 8px 0 var(--shadow-color), 0 12px 20px rgba(0,0,0,0.12);
        }
        .btn-3d:active:not(:disabled) {
            transform: translateY(6px);
            box-shadow: 0 2px 0 var(--shadow-color), 0 4px 8px rgba(0,0,0,0.12);
        }
        .btn-3d:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* 搖晃動畫 (答錯時) */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px) rotate(-2deg); }
            40% { transform: translateX(10px) rotate(2deg); }
            60% { transform: translateX(-8px) rotate(-1deg); }
            80% { transform: translateX(8px) rotate(1deg); }
        }
        .animate-shake {
            animation: shake 0.45s cubic-bezier(.36,.07,.19,.97) both;
        }

        /* 彈跳放大動畫 (答對或新題目時) */
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            70% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* 隱藏捲軸但可滾動 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-slate-800 overflow-x-hidden">

    <!-- ==================== JavaScript 遊戲邏輯 ==================== -->
    <script>
        /**

         * 嚴格篩選：所有 an 單字皆為「母音字母發母音」，無發音例外字

        const WORD_BANK = [

            { word: "apple", article: "an", chinese: "蘋果", emoji: "🍎" },
            { word: "astronaut", article: "an", chinese: "太空人", emoji: "🧑‍🚀" },

            { word: "alligator", article: "an", chinese: "鱷魚", emoji: "🐊" },
            { word: "orange", article: "an", chinese: "橘子", emoji: "🍊" },
            { word: "owl", article: "an", chinese: "貓頭鷹", emoji: "🦉" },
            { word: "eraser", article: "an", chinese: "橡皮擦", emoji: "🧽" },
            { word: "ice cream", article: "an", chinese: "冰淇淋", emoji: "🍦" },

            // --- 子音開頭 (a) - 30 個 ---
            { word: "robot", article: "a", chinese: "機器人", emoji: "🤖" },
            { word: "cat", article: "a", chinese: "貓咪", emoji: "🐱" },
            { word: "dog", article: "a", chinese: "小狗", emoji: "🐶" },
            { word: "banana", article: "a", chinese: "香蕉", emoji: "🍌" },
            { word: "bus", article: "a", chinese: "公車", emoji: "🚌" },
            { word: "car", article: "a", chinese: "汽車", emoji: "🚗" },
            { word: "book", article: "a", chinese: "書本", emoji: "📘" },
            { word: "pen", article: "a", chinese: "原子筆", emoji: "🖊️" },
            { word: "pencil", article: "a", chinese: "鉛筆", emoji: "✏️" },
            { word: "ruler", article: "a", chinese: "尺", emoji: "📏" },
            { word: "bag", article: "a", chinese: "書包 / 袋子", emoji: "🎒" },
            { word: "box", article: "a", chinese: "盒子", emoji: "📦" },
            { word: "pig", article: "a", chinese: "小豬", emoji: "🐷" },
            { word: "lion", article: "a", chinese: "獅子", emoji: "🦁" },
            { word: "tiger", article: "a", chinese: "老虎", emoji: "🐯" },
            { word: "bear", article: "a", chinese: "熊", emoji: "🐻" },
            { word: "rabbit", article: "a", chinese: "兔子", emoji: "🐰" },
            { word: "turtle", article: "a", chinese: "烏龜", emoji: "🐢" },
            { word: "fish", article: "a", chinese: "魚", emoji: "🐟" },
            { word: "bird", article: "a", chinese: "小鳥", emoji: "🐦" },
            { word: "frog", article: "a", chinese: "青蛙", emoji: "🐸" },
            { word: "duck", article: "a", chinese: "鴨子", emoji: "🦆" },
            { word: "cake", article: "a", chinese: "蛋糕", emoji: "🎂" },
            { word: "cookie", article: "a", chinese: "餅乾", emoji: "🍪" },
            { word: "pizza", article: "a", chinese: "披薩", emoji: "🍕" },
            { word: "donut", article: "a", chinese: "甜甜圈", emoji: "🍩" },
            { word: "sun", article: "a", chinese: "太陽", emoji: "☀️" },
            { word: "star", article: "a", chinese: "星星", emoji: "⭐" },
            { word: "tree", article: "a", chinese: "大樹", emoji: "🌳" },
            { word: "flower", article: "a", chinese: "花朵", emoji: "🌸" }
        ];

        const PRAISE_MESSAGES = [
            "Great job! 太棒了！🌟",
            "Awesome! 真是太厲害了！🎉",
            "Super! 完全正確！✨",
            "You did it! 你做到了！👏",
            "Bingo! 聰明小達人！🏆"
        ];

        /**
         * 2. 遊戲狀態變數
         */
        let state = {
            score: 0,
            streak: 0,
            questionCount: 0,
            roundLimit: 10,          // 每回合 10 題
            isInfiniteMode: false,   // 是否為無限練習模式
            currentWordObj: null,
            usedWordsInRound: [],
            mistakesInRound: [],
            hasFailedCurrent: false, // 當前題目是否答錯過 (用於計算一次答對率)
            isTransitioning: false   // 防止答對後重複點擊
        };

        /**
         * 3. Web Audio API 音效合成器 (無需外部音檔)
         */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSoundEffect(type) {
            // 確保瀏覽器允許播放音效
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const now = audioCtx.currentTime;

            if (type === 'correct') {
                // 清脆的雙音「叮咚！」 (C5 -> E5 -> G5)
                const notes = [523.25, 659.25, 783.99];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                    
                    gain.gain.setValueAtTime(0.25, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.35);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.35);
                });
            } else if (type === 'wrong') {
                // 溫和的低音「咚咚」提示音
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.linearRampToValueAtTime(170, now + 0.25);

                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'win') {
                // 勝利小號旋律
                const melody = [523.25, 659.25, 783.99, 1046.50];
                melody.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.12);
                    gain.gain.setValueAtTime(0.25, now + idx * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.5);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.12);
                    osc.stop(now + idx * 0.12 + 0.5);
                });
            }
        }

        /**
         * 4. Web Speech API 英語語音朗讀
         */
        function speakEnglish(text, rate = 0.88) {
            if (!('speechSynthesis' in window)) return;
            
            // 取消正在播放的語音，避免重疊
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = rate; // 稍微放慢一點點，適合低年級學生聽清楚
            utterance.pitch = 1.1; // 稍微活潑親切的音調

            // 嘗試尋找美式英語語音
            const voices = window.speechSynthesis.getVoices();
            const enVoice = voices.find(v => v.lang.includes('en-US') && v.name.includes('Google')) || 
                            voices.find(v => v.lang.includes('en-US'));
            if (enVoice) {
                utterance.voice = enVoice;
            }

            window.speechSynthesis.speak(utterance);
        }

        function speakCurrentWord() {
            if (state.currentWordObj) {
                speakEnglish(state.currentWordObj.word, 0.85);
            }
        }

        /**
         * 5. 核心遊戲流程控制
         */
        function initGame() {
            // 預載語音清單
            if ('speechSynthesis' in window) {
                window.speechSynthesis.getVoices();
            }
            restartRound();
        }

        function restartRound() {
            state.score = 0;
            state.streak = 0;
            state.questionCount = 0;
            state.usedWordsInRound = [];
            state.mistakesInRound = [];
            state.isTransitioning = false;

            document.getElementById('summary-modal').classList.add('hidden');
            updateScoreboard();
            nextQuestion();
        }

        function nextQuestion() {
            // 檢查是否達到 10 題回合上限
            if (!state.isInfiniteMode && state.questionCount >= state.roundLimit) {
                showRoundSummary();
                return;
            }

            state.questionCount++;
            state.hasFailedCurrent = false;
            state.isTransitioning = false;

            // 從尚未出過的單字中隨機挑選 (若全出過則重置)
            let availableWords = WORD_BANK.filter(w => !state.usedWordsInRound.includes(w.word));
            if (availableWords.length === 0) {
                state.usedWordsInRound = [];
                availableWords = [...WORD_BANK];
            }

            const randomIndex = Math.floor(Math.random() * availableWords.length);
            state.currentWordObj = availableWords[randomIndex];
            state.usedWordsInRound.push(state.currentWordObj.word);

            renderQuestion();
            updateScoreboard();

            // 自動朗讀新單字 (延遲 250ms 讓畫面先渲染)
            setTimeout(() => {
                speakCurrentWord();
            }, 250);
        }

        function renderQuestion() {
            const wordObj = state.currentWordObj;

            // 重置卡片動畫
            const card = document.getElementById('word-card');
            card.classList.remove('animate-pop', 'animate-shake', 'border-emerald-400', 'border-rose-400');
            card.classList.add('border-sky-200');
            void card.offsetWidth; // 觸發重繪
            card.classList.add('animate-pop');

            // 設定 Emoji 與中文
            document.getElementById('word-emoji').textContent = wordObj.emoji;
            document.getElementById('word-chinese').textContent = wordObj.chinese;

            // 重置空格框
            const slot = document.getElementById('article-slot');
            slot.textContent = '?';
            slot.className = "min-w-[4.5rem] sm:min-w-[5.5rem] h-14 sm:h-16 px-3 rounded-2xl border-4 border-dashed border-slate-300 bg-slate-50 flex items-center justify-center text-3xl sm:text-4xl font-black text-slate-400 transition-all";

            // 顯示純文字單字（首字母與其他字母完全一致，不做變色或底線提示）
            document.getElementById('word-text').textContent = wordObj.word;

            // 隱藏回饋訊息
            const banner = document.getElementById('feedback-banner');
            banner.style.opacity = '0';

            // 啟用按鈕
            document.getElementById('btn-a').disabled = false;
            document.getElementById('btn-an').disabled = false;
        }

        /**
         * 6. 檢查學生答案
         */
        function checkAnswer(selectedArticle) {
            if (state.isTransitioning) return;

            const wordObj = state.currentWordObj;
            const isCorrect = (selectedArticle === wordObj.article);
            const card = document.getElementById('word-card');
            const slot = document.getElementById('article-slot');
            const banner = document.getElementById('feedback-banner');

            if (isCorrect) {
                // --- 答對處理 ---
                state.isTransitioning = true;
                document.getElementById('btn-a').disabled = true;
                document.getElementById('btn-an').disabled = true;

                playSoundEffect('correct');

                // 計算分數與連勝 (一次答對得 10 分，重試答對得 5 分)
                if (!state.hasFailedCurrent) {
                    state.score += 10;
                    state.streak += 1;
                } else {
                    state.score += 5;
                }
                updateScoreboard();

                // 填入正確冠詞並改變樣式
                slot.textContent = selectedArticle;
                const badgeColor = selectedArticle === 'an' 
                    ? 'border-rose-400 bg-rose-100 text-rose-600' 
                    : 'border-sky-400 bg-sky-100 text-sky-600';
                slot.className = `min-w-[4.5rem] sm:min-w-[5.5rem] h-14 sm:h-16 px-4 rounded-2xl border-4 ${badgeColor} flex items-center justify-center text-3xl sm:text-4xl font-black transition-all scale-110`;

                card.classList.remove('border-sky-200', 'border-rose-400');
                card.classList.add('border-emerald-400');

                // 顯示隨機鼓勵語
                const praise = PRAISE_MESSAGES[Math.floor(Math.random() * PRAISE_MESSAGES.length)];
                banner.textContent = praise;
                banner.className = "mt-4 min-h-[3.2rem] w-full rounded-2xl px-4 py-2 flex items-center justify-center text-base sm:text-lg font-extrabold bg-emerald-100 text-emerald-800 border-2 border-emerald-300 transition-all";
                banner.style.opacity = '1';

                // 朗讀完整片語 (例如: "an apple!")
                speakEnglish(`${selectedArticle} ${wordObj.word}!`, 0.9);

                // 連勝達到 3 的倍數或每題答對放小彩帶
                if (typeof confetti === 'function') {
                    confetti({
                        particleCount: state.streak >= 3 ? 60 : 25,
                        spread: 60,
                        origin: { y: 0.7 }
                    });
                }

                // 1.65 秒後自動進入下一題
                setTimeout(() => {
                    nextQuestion();
                }, 1650);

            } else {
                // --- 答錯處理 (不提供規則提示，僅鼓勵再試一次) ---
                playSoundEffect('wrong');
                state.streak = 0;

                if (!state.hasFailedCurrent) {
                    state.hasFailedCurrent = true;
                    // 記錄到錯題本 (避免重複加入)
                    if (!state.mistakesInRound.some(m => m.word === wordObj.word)) {
                        state.mistakesInRound.push(wordObj);
                    }
                }
                updateScoreboard();

                // 卡片搖晃動畫
                card.classList.remove('animate-shake', 'animate-pop');
                void card.offsetWidth;
                card.classList.add('animate-shake', 'border-rose-400');

                banner.textContent = "再想想看，再試一次喔！💪";
                banner.className = "mt-4 min-h-[3.2rem] w-full rounded-2xl px-4 py-2 flex items-center justify-center text-sm sm:text-base font-extrabold bg-amber-100 text-amber-900 border-2 border-amber-300 transition-all";
                banner.style.opacity = '1';

                // 再唸一次單字幫助思考
                speakCurrentWord();
            }
        }

        /**
         * 7. 更新計分板與模式切換
         */
        function updateScoreboard() {
            document.getElementById('score-display').textContent = state.score;
            document.getElementById('streak-display').textContent = state.streak;

            const progressContainer = document.getElementById('progress-container');
            if (state.isInfiniteMode) {
                progressContainer.classList.add('hidden');
            } else {
                progressContainer.classList.remove('hidden');
                const current = Math.min(state.questionCount, state.roundLimit);
                document.getElementById('progress-text').textContent = `第 ${current} / ${state.roundLimit} 題`;
                const percentage = (current / state.roundLimit) * 100;
                document.getElementById('progress-bar').style.width = `${percentage}%`;
            }
        }

        function toggleGameMode() {
            state.isInfiniteMode = !state.isInfiniteMode;
            const modeIcon = document.getElementById('mode-icon');
            const modeText = document.getElementById('mode-text');

            if (state.isInfiniteMode) {
                modeIcon.textContent = "♾️";
                modeText.textContent = "無限練習";
            } else {
                modeIcon.textContent = "🎯";
                modeText.textContent = "10題測驗";
            }
            restartRound();
        }

        /**
         * 8. 回合結算畫面
         */
        function showRoundSummary() {
            playSoundEffect('win');
            if (typeof confetti === 'function') {
                confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
            }

            const modal = document.getElementById('summary-modal');
            const totalQ = state.roundLimit;
            const firstTryCorrect = totalQ - state.mistakesInRound.length;
            const accuracy = Math.round((firstTryCorrect / totalQ) * 100);

            document.getElementById('summary-score').textContent = state.score;
            document.getElementById('summary-accuracy').textContent = `${accuracy}%`;

            // 計算星星數
            let stars = "⭐";
            if (accuracy >= 90) stars = "⭐⭐⭐";
            else if (accuracy >= 60) stars = "⭐⭐";
            document.getElementById('summary-stars').textContent = stars;

            // 顯示錯題列表或全對鼓勵
            const mistakesSection = document.getElementById('mistakes-section');
            const mistakesList = document.getElementById('mistakes-list');
            const perfectBanner = document.getElementById('perfect-banner');

            if (state.mistakesInRound.length > 0) {
                mistakesSection.classList.remove('hidden');
                perfectBanner.classList.add('hidden');
                mistakesList.innerHTML = '';

                state.mistakesInRound.forEach(item => {
                    const phrase = `${item.article} ${item.word}`;
                    const badgeStyle = item.article === 'an' 
                        ? 'bg-rose-100 text-rose-700 border-rose-300' 
                        : 'bg-sky-100 text-sky-700 border-sky-300';

                    const row = document.createElement('div');
                    row.className = "flex items-center justify-between bg-slate-50 hover:bg-amber-50 p-3 rounded-2xl border-2 border-slate-200 cursor-pointer transition";
                    row.onclick = () => speakEnglish(phrase, 0.85);
                    row.innerHTML = `
                        <div class="flex items-center gap-3">
                            <span class="text-3xl">${item.emoji}</span>
                            <div>
                                <div class="text-lg font-black text-slate-800">
                                    <span class="px-2 py-0.5 rounded-lg border ${badgeStyle} mr-1">${item.article}</span>${item.word}
                                </div>
                                <div class="text-xs font-bold text-slate-500">${item.chinese}</div>
                            </div>
                        </div>
                        <span class="text-amber-600 bg-amber-100 p-2 rounded-xl text-sm font-bold">🔊 聽發音</span>
                    `;
                    mistakesList.appendChild(row);
                });
            } else {
                mistakesSection.classList.add('hidden');
                perfectBanner.classList.remove('hidden');
            }

            modal.classList.remove('hidden');
        }

        /**
         * 9. 鍵盤快速鍵支援 (方便電腦操作)
         */
        document.addEventListener('keydown', (e) => {
            // 若結算視窗開啟，按 Enter 或 Space 重新開始
            const modal = document.getElementById('summary-modal');
            if (!modal.classList.contains('hidden')) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    restartRound();
                }
                return;
            }

            // 遊戲進行中快速鍵
            if (e.key === 'ArrowLeft' || e.key === '1' || e.key.toLowerCase() === 'a') {
                checkAnswer('a');
            } else if (e.key === 'ArrowRight' || e.key === '2' || e.key.toLowerCase() === 'b') {
                checkAnswer('an');
            } else if (e.key === ' ' || e.key.toLowerCase() === 'r') {
                e.preventDefault();
                speakCurrentWord();
            }
        });

        // 網頁載入完成後啟動遊戲
        window.onload = initGame;
    </script>
</body>
</html>
